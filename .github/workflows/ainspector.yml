name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: Review with ainspector
    runs-on: ubuntu-latest
    # Pull requests from forks get neither the secret nor a token that can write
    if: github.event.pull_request.head.repo.full_name == github.repository
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build ainspector
        run: go build -o ainspector .

      - name: Review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AINSPECTOR_MAX_TOKENS_PER_RUN: '300000'
        run: ./ainspector review --mode quality,security
